name: Windows MinGW tests

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-make
      - name: Build and test all five stages
        shell: msys2 {0}
        working-directory: 2025310202019_孙弋格
        run: |
          export PATH="/ucrt64/bin:/c/Windows/System32:/c/Windows"
          if command -v ninja || command -v cmake; then exit 1; fi
          g++ --version
          mingw32-make --version
          MSYS2_ARG_CONV_EXCL='*' cmd.exe /d /c 'script\build_and_run.bat'
